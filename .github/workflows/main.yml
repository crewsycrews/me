name: Site and Cassiopeia Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      telegram_update:
        description: "Slug сообщения для явного обновления в Telegram (пусто — только новые)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: site-and-telegram-publication
  cancel-in-progress: false

jobs:
  deploy-cassiopeia:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, x64, crews-main-msk]
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node for bot tests
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test Cassiopeia without Telegram requests
        run: npm run test:leads

      - name: Update /opt/me and restart Cassiopeia on crews-main-msk
        shell: bash
        env:
          DEPLOY_GITHUB_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/bots/cassiopeia/deploy/deploy.sh"

  build-and-deploy:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 for runner
        run: npm rebuild better-sqlite3 --build-from-source

      - name: Generate static site
        env:
          NUXT_PUBLIC_LEAD_BOT_URL: ${{ vars.NUXT_PUBLIC_LEAD_BOT_URL || 'https://cassey.danilrodin.ru/go' }}
        run: npm run generate

      - name: Validate Telegram posts and record generated pages
        run: npm run telegram -- prepare

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .output/public

      - name: Publish Telegram posts after pages become available
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_UPDATE: ${{ inputs.telegram_update }}
        run: |
          if [ -n "$TELEGRAM_UPDATE" ]; then
            npm run telegram -- update "$TELEGRAM_UPDATE"
          else
            npm run telegram -- publish
          fi
