name: Nuxt SSG Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      telegram_update:
        description: "Slug сообщения для явного обновления в Telegram (пусто — только новые)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: site-and-telegram-publication
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 for runner
        run: npm rebuild better-sqlite3 --build-from-source

      - name: Generate static site
        run: npm run generate

      - name: Validate Telegram posts and record generated pages
        run: npm run telegram -- prepare

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .output/public

      - name: Publish Telegram posts after pages become available
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_UPDATE: ${{ inputs.telegram_update }}
        run: |
          if [ -n "$TELEGRAM_UPDATE" ]; then
            npm run telegram -- update "$TELEGRAM_UPDATE"
          else
            npm run telegram -- publish
          fi
